// App 模块（design-android-mobile-app §3/§4.3/§6.4）。
// 关键点：
// - minSdk 26（Android 8.0+），ABI arm64-v8a 为主；
// - useLegacyPackaging=true → 安装时把 jniLibs（libproot.so / libproot-loader.so）解压到
//   nativeLibraryDir，绕过 Android 10+ 可写目录 exec 限制（§4.3）；
// - commons-compress + zstd-jni 用于运行时 .tar.zst 解压（RootfsInstaller）。
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.agentlray.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.agentlray.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 仅 arm64-v8a（Node 官方 arm64 构建一致）；x86_64 仅模拟器需独立 rootfs（§6.1）。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    // jniLibs 安装时解压（对应 AndroidManifest 的 extractNativeLibs=true 语义）。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled = false
            // 正式签名经 CI 注入 keystore（不入库，§6.4）。未配置时用 debug 签名占位。
            signingConfig = signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    // 16KB page size（Android 15+）：native 库需按 16KB 对齐编译（§4.3）。
    // 具体由 jniLibs 中 proot 重建时加 `-Wl,-z,max-page-size=16384` 保证；此处仅记录。
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // 运行时解压：zstd 解压 + tar 解析（支持符号/硬链接与权限位）。
    implementation "com.github.luben:zstd-jni:$zstdVersion"
    implementation "org.apache.commons:commons-compress:$commonsCompressVersion"
}
