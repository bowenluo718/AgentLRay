// App 模块（design-android-mobile-app §3/§4.3/§6.4）。
// 关键点：
// - minSdk 26（Android 8.0+），ABI arm64-v8a 为主；
// - useLegacyPackaging=true → 安装时把 jniLibs（libproot.so / libproot-loader.so）解压到
//   nativeLibraryDir，绕过 Android 10+ 可写目录 exec 限制（§4.3）；
// - commons-compress 用于运行时 .tgz 解压（RootfsInstaller）。
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 正式签名经环境变量/ gradle 属性注入（keystore 不入库，design §6.4）：
//   AGENTLRAY_KEYSTORE / AGENTLRAY_KEYSTORE_PASSWORD / AGENTLRAY_KEY_ALIAS / AGENTLRAY_KEY_PASSWORD
// 或 -PagentlrayKeystore=... 等。未配置时 release 退回 debug 签名（仅本地冒烟）。
def releaseStoreFile = System.getenv("AGENTLRAY_KEYSTORE") ?: project.findProperty("agentlrayKeystore")
def hasReleaseSigning = releaseStoreFile != null

android {
    namespace "com.agentlray.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.agentlray.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 仅 arm64-v8a（Node 官方 arm64 构建一致）；x86_64 仅模拟器需独立 rootfs（§6.1）。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("AGENTLRAY_KEYSTORE_PASSWORD") ?: project.findProperty("agentlrayKeystorePassword")
                keyAlias System.getenv("AGENTLRAY_KEY_ALIAS") ?: project.findProperty("agentlrayKeyAlias")
                keyPassword System.getenv("AGENTLRAY_KEY_PASSWORD") ?: project.findProperty("agentlrayKeyPassword")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 本地 JVM 单测（src/test）：纯逻辑（如 NativeBackHost 的返回键决策）不依赖 Android 运行时；
    // org.json 等 framework 桩由 returnDefaultValues 兜底（相关用例不触达真实实现）。
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // jniLibs 安装时解压（对应 AndroidManifest 的 extractNativeLibs=true 语义）。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // P4：代码压缩/混淆（规则见 proguard-rules.pro）。shrinkResources 暂不开：
            // Capacitor 模板资源有动态引用，需真机构建验证后再启用（§6.4 体积）。
            minifyEnabled = true
            shrinkResources = false
            proguardFiles 'proguard-rules.pro'
            // 正式签名经 CI 注入 keystore（不入库，§6.4）。未配置时用 debug 签名占位。
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    // 16KB page size（Android 15+）：native 库需按 16KB 对齐编译（§4.3）。
    // 具体由 jniLibs 中 proot 重建时加 `-Wl,-z,max-page-size=16384` 保证；此处仅记录。
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // 运行时解压：gzip（Android 内置 GZIPInputStream）+ commons-compress tar 解析。
    // 原设计用 zstd-jni，但其无 Android ABI 分类器（linux_aarch64 为 glibc，bionic 无法加载），
    // 按 design「解压兼容性兜底」改用 gzip。
    implementation "org.apache.commons:commons-compress:$commonsCompressVersion"

    // 本地 JVM 单测（NativeBackHostTest 等）。
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.assertj:assertj-core:$assertjVersion"
}
